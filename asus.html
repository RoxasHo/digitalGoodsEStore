<!DOCTYPE html>
<html>
    <head>
        <!--Setting up characters/symbols-->
        <meta charset="utf-8">
        <!--Page title-->
        <title>GCH Tech Homepage</title>
        <!--Linking Cascasing Style Sheets to the page-->
        <link rel="stylesheet" href="main.css">
        <link rel="stylesheet" href="nav.css">
        <link rel="stylesheet" href="brand.css">
    </head>

    <body>
        <!--Page header-->
        <div class="header">
            <!--Adding hyperlink onto the header logo, for easy navigation back to the homepage by clicking on it-->
            <a href="home.html">
                <!--Website logo as an image-->
                <img id="homepagelogo" src="images/header/headericon.png" alt="gchtech_icon" height="60">
            </a>
            <!--Business start date-->
            <div id="startyear">
                <p>Since 2018.</p>
            </div>
        </div>
        
        <!--Page navigation bar-->
        <div class="navbar">
            <!--Hyperlink directing to homepage-->
            <a href="home.html">Home</a>
            <!--Dropdown menu element for flexbile navigation-->
            <div class="dropdown">
                <!--Dropdown button - Category-->
                <button class="dropbtn">Category &#9660;
                    <i class="fa fa-caret-down"></i>
                </button>
                <!--Dropdown menu content-->
                <div class="dropdownc">
                    <!--Hyperlink directing to the store showing laptops, mouses and keyboards respectively-->
                    <a href="laptop.html">Laptops</a>
                    <a href="mouse.html">Mouses</a>
                    <a href="keyboard.html">Keyboards</a>
                </div>
            </div>
            <!--Dropdown menu element for flexbile navigation-->
            <div class="dropdown">
                <!--Dropdown button - Brands-->
                <button class="dropbtn">Brands &#9660;
                  <i class="fa fa-caret-down"></i>
                </button>
                <!--Dropdown menu content-->
                <div class="dropdownc">
                    <!--Hyperlink directing to the store sorted by brands such as acer, hp and asus(not sponsored)-->
                    <a href="acer.html">Acer</a>
                    <a href="hp.html">Hp</a>
                    <a href="asus.html">Asus</a>
                </div>
            </div>
            <!--Hyperlink directing to the contact page-->
            <a href="contact.html">Contact</a>
            <!--Hyperlink directing to about us-->
            <a href="about.html">About Us</a>
        </div>

        <!--Brand wrapper-->
        <div id="brandwrapper">
            <main>
                <!--Setting up product's logo-->
                <img src="images/asus/logos/asuslogo.png" height="200" width="400" alt="hplogo"></a>
                <div class="row">
                    <div class="column">
                        <!--Products' image and name-->
                        <figure>
                          <a href="asus1.html"><img src="images/asus/laptops/asus 1.png" height="210" width="300" alt="Asus ROG STRIX G17"></a>
                          <figcaption>Asus ROG STRIX G17</figcaption>
                    </div>
                    <div class="column">
                      <a href="asus2.html"><img src="images/asus/laptops/asus 2.png" height="300" width="300" alt="Asus TUF F17"></a>
                      <figcaption>Asus TUF F17</figcaption>
                    </div>
                    <div class="column">
                      <a href="asus3.html"><img src="images/asus/laptops/asus 3.png" height="300" width="300" alt="Asus VivoBook S14"></a>
                      <figcaption>Asus VivoBook S14</figcaption>
                    </div>
                    <div class="column">
                      <a href="asus4.html"><img src="images/asus/laptops/asus 4.png" height="300" width="300" alt="Asus Laptop E410"></a>
                      <figcaption>Asus Laptop E410</figcaption>
                    </div>
                    </figure>
                </div>
            </main>
        </div>

        <!--Wrapper for footer-->
        <div id="footerwrapper">
            <!--Page footer-->
            <div class="footer">
                <!--Row class for list-->
                <div class="frow1">
                    <!--Unordered list-->
                    <ul>
                        <!--Brand logos at the footer-->
                        <li><img class="icon1" src="images/footer/acerlogo.png"  width="8%"></li>
                        <li><img class="icon2" src="images/footer/hplogo.png" width="5%"></li>
                        <li><img src="images/footer/asuslogo.png" width="8%"></li>
                    </ul>
                </div>
                <!--Web rights infos-->
                <p>©GCHTech Computer Inc. All Rights Reserved.</p>
                <!--Horizontal line for aesthetic purpose-->
                <hr>
                <!--Row class for list-->
                <div class="frow2">
                    <!--Unordered list-->
                    <ul>
                        <!--Social media icons at the footer-->
                        <li><img src="images/footer/social-facebook.png" width="3%"></li>
                        <li><img src="images/footer/social-Instagram.png" width="3%"></li>
                        <li><img src="images/footer/social-YouTube.png" width="3%"></li>
                        <li><img src="images/footer/social-LinkedIn.png" width="3%"></li>
                    </ul>
                </div>
            </div>
        </div>
    </body>
</html>
